<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snap Folders</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; min-height: 100vh; }
    aside {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    aside h1 { font-size: 17px; margin: 0; }
    #folders { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    #folders li {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; border-radius: var(--radius); cursor: pointer;
    }
    #folders li:hover { background: var(--border); }
    #folders li.active { background: var(--accent); color: #fff; }
    #folders li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #folders li .count { font-size: 12px; opacity: .7; }
    main { flex: 1; padding: 20px 24px; min-width: 0; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    header h2 { margin: 0; font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .thumb-grid { --thumb: 220px; gap: 14px; }
    .thumb .actions { display: flex; gap: 4px; padding: 0 8px 8px; flex-wrap: wrap; }
    .thumb .actions select { font-size: 12px; padding: 3px 6px; flex: 1; }
    .empty { padding: 60px 0; text-align: center; }

    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center; z-index: 10; padding: 24px;
    }
    #lightbox img { max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

    aside .account { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    #account { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #signed-out {
      position: fixed; inset: 0; z-index: 20; background: var(--bg);
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }
      aside { width: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      main { padding: 16px; }
      .thumb-grid { --thumb: 150px; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Snap Folders</h1>
    <form id="new-folder-form" class="row">
      <input id="new-folder-name" type="text" class="grow" placeholder="New folder" maxlength="60" />
      <button type="submit" class="primary">Add</button>
    </form>
    <div id="error" class="error"></div>
    <ul id="folders"></ul>
    <div class="account">
      <div id="account" class="muted"></div>
      <button id="sign-out" class="icon">Sign out</button>
    </div>
  </aside>

  <main>
    <header>
      <h2 id="folder-title"></h2>
      <button id="rename-folder">Rename</button>
      <button id="download-folder">Download all</button>
      <button id="delete-folder" class="danger">Delete folder</button>
    </header>
    <div id="shots" class="thumb-grid"></div>
  </main>

  <div id="lightbox" class="hidden"><img alt="" /></div>

  <div id="signed-out" class="hidden">
    <div>
      <h2>You're signed out</h2>
      <p class="muted">Click the Snap Folders button in the toolbar to sign in.</p>
    </div>
  </div>

  <script type="module" src="gallery.js"></script>
</body>
</html>
