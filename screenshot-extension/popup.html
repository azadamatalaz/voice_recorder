<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 340px; padding: 14px; }
    h1 { font-size: 16px; margin: 0; }
    section { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .topbar { margin-bottom: 12px; }
    .account { font-size: 12px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .capture { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .capture button { padding: 10px; }
    .thumb-grid { --thumb: 95px; }
    .empty { text-align: center; padding: 16px 0; }
    kbd { font-size: 11px; color: var(--muted); }

    /* Auth */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; background: var(--surface); border-radius: var(--radius); margin: 12px 0; }
    .tabs button { border: 0; background: transparent; padding: 6px; }
    .tabs button.active { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
    #auth-form { display: flex; flex-direction: column; gap: 10px; }
    #auth-form input { width: 100%; }
    #auth-form button[type="submit"] { padding: 9px; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 12px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    #google-btn { width: 100%; padding: 9px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .notice { font-size: 12px; padding: 8px 10px; border-radius: var(--radius); background: var(--surface); }
    code { font-size: 11px; word-break: break-all; }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <!-- Shown when config.js still has placeholder values -->
  <div id="setup-view" class="hidden">
    <h1>Snap Folders</h1>
    <p class="notice">Supabase isn't configured yet. Add your project URL and anon key to <code>config.js</code>, then reload the extension.</p>
  </div>

  <!-- Signed out -->
  <div id="auth-view" class="hidden">
    <h1>Snap Folders</h1>
    <div class="tabs">
      <button type="button" data-mode="signin" class="active">Sign in</button>
      <button type="button" data-mode="signup">Create account</button>
    </div>
    <form id="auth-form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required />
      <button type="submit" class="primary" id="auth-submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button id="google-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>
    <div id="auth-message" class="notice hidden" style="margin-top:12px"></div>
    <div id="auth-error" class="error" style="margin-top:8px"></div>
  </div>

  <!-- Signed in -->
  <div id="app-view" class="hidden">
    <div class="row topbar">
      <h1 class="grow">Snap Folders</h1>
      <span id="account" class="account muted"></span>
      <button id="sign-out" class="icon">Sign out</button>
    </div>

    <section>
      <label for="folder">Save to folder</label>
      <div class="row">
        <select id="folder" class="grow"></select>
        <button id="new-folder-btn" title="New folder">+ Folder</button>
      </div>
      <form id="new-folder-form" class="row hidden" style="margin-top:8px">
        <input id="new-folder-name" type="text" class="grow" placeholder="Folder name" maxlength="60" />
        <button type="submit" class="primary">Create</button>
      </form>
      <div id="error" class="error"></div>
    </section>

    <section class="capture">
      <button id="capture-visible" class="primary">Visible area<br><kbd>Alt+Shift+S</kbd></button>
      <button id="capture-region">Select area<br><kbd>Alt+Shift+A</kbd></button>
    </section>

    <section>
      <div class="row" style="margin-bottom:8px">
        <strong class="grow">Recent in this folder</strong>
        <button id="open-gallery" class="icon">Open gallery</button>
      </div>
      <div id="recent" class="thumb-grid"></div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
